[package]
name = "Aether"
version = "0.1.0"
description = "Aether 메뉴 막대 관리 앱"
authors = ["aether"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
ureq = { version = "3", default-features = false }
serde_json = "1"
sys-locale = "0.3"
objc2-service-management = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
